# 个人开发平台 nginx 站点配置（生产用）
# 用法（服务器上，见 deploy/README.md）：
#   sudo nginx -t
#   把本文件放到 sites-enabled（或 conf.d），再 sudo systemctl reload nginx
# 注意：域名、证书路径按你的服务器改；没域名时 server_name 先用 _ 占位，只走 IP/内网。
# 本配置只暴露 80（HTTPS 请在下面 443 段取消注释并填证书）；应用本身只绑 127.0.0.1:3001，不直接对外。

server {
    listen 80;
    server_name _;

    # API 体上限：后端 express.json 限 200KB，这里放宽到 1m 即可，不要放太大
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 登录 Cookie 是 SameSite=Lax，代理层不改 Cookie 即可；不要在这里加 Secure（除非已上 HTTPS）
    }

    # 前端构建产物带 hash 文件名，可长期缓存；index.html 本身不缓存，见下面
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

